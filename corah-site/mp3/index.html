<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corah Centre for Rural Aging & Health</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER (Flexbox) -->
    <header class="header-container">
        <div class="logo-container">
            <img src="images/corah-brand-logo.svg" alt="Corah brand icon" class="brand-logo">
            <img src="images/corah-wordmark.svg" alt="Corah wordmark" class="brand-wordmark">
        </div>

        <nav class="nav-container" aria-label="Main navigation">
            <ul class="nav-pill">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#events">Events</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO SECTION (CSS Grid) -->
    <section class="hero" id="home">
        <div class="hero-text">
            <h1>Welcome to Corah</h1>
            <p>Supporting rural aging and health through innovation and community.</p>
            <button class="cta-button">Learn More</button>
        </div>

        <div class="hero-image">
            <img src="images/hero-image.jpg" alt="Community members receiving care at Corah">
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="footer-container">
            <p>&copy; 2025 Corah Centre for Rural Aging & Health</p>

            <nav aria-label="Footer navigation">
                <a href="#privacy">Privacy Policy</a> | 
                <a href="#accessibility">Accessibility</a>
            </nav>
        </div>
    </footer>

</body>
</html>
